[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillplus-example-python"
version = "0.1.0"
description = "Every SkillPlus SDK call, in a plain Python CLI"
requires-python = ">=3.10"
dependencies = ["skillplus>=0.3.0"]

[project.scripts]
skillplus-example = "skillplus_example.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillplus_example"]
